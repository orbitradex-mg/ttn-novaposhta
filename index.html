<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ТТН Нової пошти</title>
  <link rel="stylesheet" href="css/styles.css?v=20260519b">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header__brand">
        <span class="header__logo" aria-hidden="true">NP</span>
        <div>
          <h1 class="header__title">Відправлення Нової пошти</h1>
          <p class="header__subtitle">ТТН та статуси для менеджерів</p>
        </div>
      </div>
      <div class="header__actions">
        <button type="button" class="btn btn--primary" id="btn-refresh">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
          Оновити
        </button>
      </div>
    </header>

    <section class="filters card">
      <div class="filters__row">
        <label class="field">
          <span class="field__label">З дати</span>
          <input type="date" id="date-from" class="field__input">
        </label>
        <label class="field">
          <span class="field__label">По дату</span>
          <input type="date" id="date-to" class="field__input">
        </label>
        <label class="field field--grow">
          <span class="field__label">Пошук</span>
          <input type="search" id="search" class="field__input" placeholder="ТТН, внутр. №, ім'я…">
        </label>
      </div>
      <div class="filters__meta">
        <span id="data-source" class="badge badge--muted">—</span>
        <span id="last-updated" class="text-muted"></span>
      </div>
    </section>

    <section class="stats" id="stats" hidden>
      <article class="stat card">
        <span class="stat__value" id="stat-total">0</span>
        <span class="stat__label">Всього</span>
      </article>
      <article class="stat card">
        <span class="stat__value" id="stat-transit">0</span>
        <span class="stat__label">В дорозі</span>
      </article>
      <article class="stat card">
        <span class="stat__value" id="stat-delivered">0</span>
        <span class="stat__label">Отримано</span>
      </article>
    </section>

    <section class="table-wrap card">
      <div id="loading" class="state state--loading" hidden>
        <span class="spinner"></span>
        <p>Завантаження відправлень…</p>
      </div>
      <div id="error" class="state state--error" hidden></div>
      <div id="empty" class="state state--empty" hidden>
        <p>Немає відправлень за обраний період.</p>
        <p class="text-muted">Спробуйте змінити період дат.</p>
      </div>
      <div class="table-scroll" id="table-container" hidden>
        <table class="table table--responsive">
          <thead>
            <tr>
              <th>ТТН</th>
              <th>Внутр. №</th>
              <th>Дата</th>
              <th>Отримувач</th>
              <th>Телефон</th>
              <th>Місто / відділення</th>
              <th>Статус</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </section>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js?v=20260519b"></script>
</body>
</html>
