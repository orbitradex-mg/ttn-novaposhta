name: Sync Nova Poshta TTN

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch shipments from Nova Poshta API
        env:
          NP_API_KEY: ${{ secrets.NP_API_KEY }}
          NP_DAYS: ${{ vars.NP_DAYS || '14' }}
        run: node scripts/sync.js

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/shipments.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: sync Nova Poshta shipments"
            git push
          fi
