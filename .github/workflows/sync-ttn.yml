name: Sync Nova Poshta TTN

# Оновлення data/shipments.json:
# - за розкладом: кожні 2 години за UTC (0:00, 2:00, 4:00 …)
# - вручну: Actions → цей workflow → Run workflow
#
# Якщо в історії лише «Manually run» і немає «scheduled»:
# GitHub може вимкнути cron після ~60 днів без активності в репозиторії.
# Увімкніть workflow (Actions → Sync … → Enable workflow) або зробіть будь-який push у main.

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-nova-poshta-ttn
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch shipments from Nova Poshta API
        env:
          NP_API_KEY: ${{ secrets.NP_API_KEY }}
          NP_DAYS: ${{ vars.NP_DAYS || '14' }}
        run: node scripts/sync.js

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/shipments.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: sync Nova Poshta shipments"
            git push
          fi
